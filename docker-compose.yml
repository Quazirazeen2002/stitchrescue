services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      STORAGE_PATH: /app/storage
      DATABASE_PATH: /app/storage/stitchrescue.db
      FRONTEND_ORIGIN: http://localhost:3000
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data:ro
      - ./knowledge:/app/knowledge:ro
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
